name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git libffi-dev libssl-dev python3-dev \
          build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev \
          libgdbm-dev libgdbm-compat-dev liblldb-dev libreadline-dev \
          libncurses5-dev libncursesw5-dev libmaxminddb-dev checkinstall zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config cmake

        pip install --upgrade pip
        pip install --upgrade "cython==0.29.33" buildozer

    - name: Prepare main.py and buildozer.spec
      run: |
        if [ ! -f main.py ] && [ -f main_mobile.py ]; then
          cp main_mobile.py main.py
        fi

        cat << 'EOF' > buildozer.spec
        [app]
        title = LANHUB Server
        package.name = lanhub
        package.domain = org.lanhub
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,html,css,js,json,txt
        version = 1.0.0
        requirements = python3,kivy==2.2.1,flask,requests,jinja2,werkzeug,urllib3,certifi,chardet,idna,pyjnius,android
        android.permissions = INTERNET, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE, ACCESS_NETWORK_STATE, CHANGE_WIFI_MULTICAST_STATE
        
        # Hạ API xuống 31 và chỉ định NDK 25b để tránh lỗi biên dịch C++ (harfbuzz)
        android.api = 31
        android.minapi = 21
        android.ndk = 25b
        android.accept_sdk_license = True
        android.archs = arm64-v8a

        [buildozer]
        log_level = 2
        warn_on_root = 0
        EOF

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LANHUB-APK
        path: bin/*.apk

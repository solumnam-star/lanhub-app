name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git libffi-dev libssl-dev python3-dev \
          build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev \
          libgdbm-dev libgdbm-compat-dev liblldb-dev libreadline-dev \
          libncurses5-dev libncursesw5-dev libmaxminddb-dev checkinstall zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config cmake

        pip install --upgrade pip
        pip install --upgrade "cython==0.29.33" buildozer

    - name: Prepare buildozer.spec and main.py
      run: |
        if [ ! -f main.py ] && [ -f main_mobile.py ]; then
          cp main_mobile.py main.py
        fi
        if [ -f LANHUBPro.spec ]; then
          cp LANHUBPro.spec buildozer.spec
        fi

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LANHUB-APK
        path: bin/*.apk
